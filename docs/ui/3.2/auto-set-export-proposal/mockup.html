<!doctype html><html lang="ru"><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;background:#0d1829;color:#edf4ff;font:14px Arial,sans-serif;width:1120px;height:780px;overflow:hidden}.app{padding:20px 24px;height:780px}.head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px}.title{font-size:25px;font-weight:700}.sub{color:#a9b8cc;margin-top:6px;max-width:760px}.pill{background:#17263b;border:1px solid #30445f;border-radius:18px;padding:8px 12px;color:#b7c8dd}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}.metric{background:#132238;border:1px solid #2b405e;border-radius:10px;padding:13px 16px}.metric b{font-size:22px;display:block;margin-bottom:4px}.muted{color:#91a4bd}.panel{background:#111f33;border:1px solid #2c405d;border-radius:12px;padding:16px}.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.toolbar h2{font-size:18px;margin:0}.sets{display:grid;grid-template-columns:1fr 1fr;gap:12px}.set{background:#17263a;border:1px solid #314762;border-radius:10px;padding:14px 15px;min-height:122px}.settop{display:flex;justify-content:space-between;align-items:center}.setname{font-size:17px;font-weight:700}.count{background:#223651;border-radius:14px;padding:5px 9px;color:#d4e3f7}.set p{color:#aabbd0;margin:10px 0 0;line-height:1.4}.nested{font-size:12px;color:#79d8d6;margin-top:10px}.actions{display:flex;gap:10px;align-items:center;margin-top:16px}.spacer{flex:1}.btn{padding:9px 14px;border-radius:7px;border:1px solid #435b79;background:#1a2d47;color:#eef5ff}.primary{background:#0f6675;border-color:#48c7d2}.ghost{background:#15243a}.check{margin-top:13px;color:#dce7f5}.status{margin-top:10px;color:#9eb0c8}.warning{margin-top:14px;background:#302415;border:1px solid #765b29;border-radius:9px;padding:12px;color:#f0dba5}.manual{margin-top:14px;border-top:1px solid #344a67;padding-top:14px}.table{width:100%;border-collapse:collapse}.table th,.table td{border:1px solid #30445f;padding:9px;text-align:left}.table th{background:#21334b}.hidden{display:none}.disabled{opacity:.45}.tag{font-size:12px;border-radius:12px;padding:4px 8px;background:#243852;color:#bcd0e8}.right{float:right}.footnote{font-size:12px;color:#8195ae;margin-top:8px}
</style><body><div class="app" id="app"></div><script>
const state=new URLSearchParams(location.search).get('state')||'default';
const sets=[['Мини','8','Главные персонажи, базовый декор','Входит в Стандарт'],['Стандарт','16','Мини + композиции и дополнительные элементы','Входит в Макси'],['Макси','24','Стандарт + рамки, венки и расширенный декор','Входит в Полный бандл'],['Полный бандл','30','Вся коллекция','Полная коллекция']];
function cards(){return sets.map(s=>`<div class=set><div class=settop><span class=setname>${s[0]}</span><span class=count>${s[1]} PNG</span></div><p>${s[2]}</p><div class=nested>${s[3]}</div></div>`).join('')}
function base(extra='',manual=''){return `<div class=head><div><div class=title>Экспорт наборов</div><div class=sub>Приложение уже распределило готовые изображения по наборам. Один PNG может входить в несколько ZIP без повторной генерации.</div></div><div class=pill>Clipart · готово к экспорту</div></div><div class=summary><div class=metric><b>30</b><span class=muted>уникальных PNG</span></div><div class=metric><b>78</b><span class=muted>включений в наборы</span></div><div class=metric><b>4</b><span class=muted>отдельных ZIP</span></div></div><div class=panel><div class=toolbar><h2>Предложенные наборы</h2><button class="btn ghost">Изменить состав наборов</button></div><div class=sets>${cards()}</div>${extra}${manual}<div class=check>☑ Я проверил(а) изображения и состав наборов</div><div class=status>В каждый ZIP войдут PNG, обзорный PDF Letter и manifest. Исходники не изменяются.</div><div class=actions><button class=btn>Закрыть</button><div class=spacer></div><button class="btn primary">Создать 4 ZIP</button></div></div>`}
if(state==='default') app.innerHTML=base();
if(state==='review') app.innerHTML=base(`<div class=warning><b>Нужно проверить 2 изображения</b><br>Для одного объекта получено несколько успешных вариантов, ещё у одного нет готового результата. Приложение ничего не выбрало и не заменило автоматически. Наборы с этими объектами помечены для проверки.</div>`).replace('☑ Я проверил(а)','☐ Я проверил(а)').replace('class="btn primary"','class="btn primary disabled"');
if(state==='manual') app.innerHTML=base('',`<div class=manual><div class=toolbar><h2>Изменить состав наборов</h2><span class=tag>Необязательно</span></div><table class=table><tr><th>PNG</th><th>Мини</th><th>Стандарт</th><th>Макси</th><th>Полный</th></tr><tr><td>001_teddy.png</td><td>✓</td><td>✓</td><td>✓</td><td>✓</td></tr><tr><td>002_airplane.png</td><td></td><td>✓</td><td>✓</td><td>✓</td></tr><tr><td>003_wreath.png</td><td></td><td></td><td>✓</td><td>✓</td></tr></table><div class=footnote>Изменения затрагивают только состав ZIP. Повторная генерация или обработка не запускается.</div></div>`);
</script></html>
