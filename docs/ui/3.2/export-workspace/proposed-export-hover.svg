<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="780" viewBox="0 0 1120 780"><rect x="0" y="0" width="1120" height="780" rx="0" fill="#0d1728" stroke="none" stroke-width="1"/><rect x="16" y="18" width="274" height="744" rx="9" fill="#1d2a3b" stroke="#31475f" stroke-width="1"/><text x="38" y="55" font-family="DejaVu Sans" font-size="24" font-weight="700" fill="#f3f7fc">Шаги</text><text x="38" y="96" font-family="DejaVu Sans" font-size="15" font-weight="600" fill="#20c3b7">✓ 1. Идея</text><text x="38" y="128" font-family="DejaVu Sans" font-size="15" font-weight="600" fill="#20c3b7">✓ 2. Визуальное направление</text><text x="38" y="160" font-family="DejaVu Sans" font-size="15" font-weight="600" fill="#20c3b7">✓ 3. Референсы</text><text x="38" y="192" font-family="DejaVu Sans" font-size="15" font-weight="600" fill="#20c3b7">✓ 4. Структура набора</text><text x="38" y="224" font-family="DejaVu Sans" font-size="15" font-weight="600" fill="#20c3b7">✓ 5. Объекты</text><text x="38" y="256" font-family="DejaVu Sans" font-size="15" font-weight="600" fill="#20c3b7">✓ 6. Промпты и запуск</text><text x="38" y="288" font-family="DejaVu Sans" font-size="15" font-weight="600" fill="#20c3b7">✓ 7. Проверка</text><rect x="27" y="300" width="250" height="29" rx="5" fill="#193c44" stroke="none" stroke-width="1"/><text x="38" y="320" font-family="DejaVu Sans" font-size="15" font-weight="700" fill="#20c3b7">● 8. Экспорт</text><line x1="308" y1="30" x2="308" y2="752" stroke="#1f3047"/><text x="330" y="63" font-family="DejaVu Sans" font-size="25" font-weight="700" fill="#f3f7fc">Экспорт наборов</text><text x="330" y="92" font-family="DejaVu Sans" font-size="13" font-weight="400" fill="#91aac4">Проверьте состав, затем создайте ZIP. Изображения можно распределять по нескольким наборам.</text><rect x="330" y="112" width="365" height="74" rx="8" fill="#1d2a3b" stroke="#31475f" stroke-width="1"/><text x="348" y="145" font-family="DejaVu Sans" font-size="25" font-weight="700" fill="#f3f