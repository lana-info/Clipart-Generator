mily="DejaVu Sans" font-size="13" font-weight="400" fill="#91aac4">2 PNG</text><rect x="929" y="146" width="143" height="36" rx="6" fill="#23354b" stroke="#31475f" stroke-width="1"/><text x="943" y="169" font-family="DejaVu Sans" font-size="13" font-weight="400" fill="#f3f7fc">Удалить</text><rect x="320" y="0" width="800" height="780" fill="#07111d" fill-opacity="0.8"/><rect x="425" y="245" width="586" height="271" rx="10" fill="#1d2a3b" stroke="#4d6b89" stroke-width="2"/><text x="449" y="286" font-family="DejaVu Sans" font-size="19" font-weight="700" fill="#f3f7fc">Удалить набор «Полный набор»?</text><text x="449" y="323" font-family="DejaVu Sans" font-size="13" font-weight="400" fill="#91aac4">Сам набор исчезнет из списка. PNG останутся в проекте.</text><text x="449" y="349" font-family="DejaVu Sans" font-size="13" font-weight="400" fill="#91aac4">После удаления можно создать новый набор; PNG сохранятся.</text><rect x="624" y="456" width="155" height="36" rx="6" fill="#23354b" stroke="#31475f" stroke-width="1"/><text x="638" y="479" font-family="DejaVu Sans" font-size="13" font-weight="400" fill="#f3f7fc">Отмена</text><rect x="791" y="456" width="192" height="36" rx="6" fill="#20c3b7" stroke="#20c3b7" stroke-width="1"/><text x="805" y="479" font-family="DejaVu Sans" font-size="13" font-weight="600" fill="#071b26">Удалить набор</text></svg>