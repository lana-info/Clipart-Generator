 x="260" y="149" width="834" height="42" rx="5" fill="#22c8b8" stroke="#22c8b8"/><text x="584" y="176" fill="#09221f" font-family="DejaVu Sans,Arial" font-size="14" font-weight="700">Подготовить набор</text><text x="260" y="219" fill="#edf5fb" font-family="DejaVu Sans,Arial" font-size="13" font-weight="700">Готово: подготовлено 2 идеи.</text><text x="260" y="243" fill="#9cb1c6" font-family="DejaVu Sans,Arial" font-size="12" font-weight="400">Нажмите «Далее», чтобы перейти к промптам.</text><text x="260" y="264" fill="#9cb1c6" font-family="DejaVu Sans,Arial" font-size="12" font-weight="400">Чтобы проверить или поправить идеи, откройте их список.</text><rect x="260" y="288" width="834" height="40" rx="5" fill="#1f2a3a" stroke="#34475a"/><text x="556" y="314" fill="#edf5fb" font-family="DejaVu Sans,Arial" font-size="13" font-weight="400">Посмотреть и изменить идеи</text></svg>