 x="260" y="149" width="834" height="42" rx="5" fill="#22c8b8" stroke="#22c8b8"/><text x="584" y="176" fill="#09221f" font-family="DejaVu Sans,Arial" font-size="14" font-weight="700">Подготовить набор</text><text x="260" y="219" fill="#edf5fb" font-family="DejaVu Sans,Arial" font-size="13" font-weight="700">Готово: подготовлено 2 идеи.</text><text x="260" y="243" fill="#9cb1c6" font-family="DejaVu Sans,Arial" font-size="12" font-weight="400">Нажмите «Далее», чтобы перейти к промптам.</text><text x="260" y="264" fill="#9cb1c6" font-family="DejaVu Sans,Arial" font-size="12" font-weight="400">Чтобы проверить или поправить идеи, откройте их список.</text><rect x="260" y="288" width="834" height="40" rx="5" fill="#1f2a3a" stroke="#34475a"/><text x="596" y="314" fill="#edf5fb" font-family="DejaVu Sans,Arial" font-size="13" font-weight="400">Скрыть идеи</text><rect x="260" y="345" width="834" height="350" rx="8" fill="#1f2a3a" stroke="#34475a"/><text x="278" y="375" fill="#edf5fb" font-family="DejaVu Sans,Arial" font-size="15" font-weight="700">Идеи набора</text><rect x="276" y="392" width="266" height="42" rx="4" fill="#254841" stroke="#22c8b8"/><text x="289" y="419" fill="#edf5fb" font-family="DejaVu Sans,Arial" font-size="11" font-weight="400">001 · Медвежонок с подарком</text><rect x="276" y="440" width="266" height="42" rx="4" fill="#1f2a3a" stroke="#34475a"/><text x="289" y="467" fill="#edf5fb" font-family="DejaVu Sans,Arial" font-size="11" font-weight="400">002 · Медвежонок с ёлкой</text><text x="564" y="376" fill="#edf5fb" font-family="DejaVu Sans,Arial" font-size="15" font-weight="700">Выбранная идея</text><text x="564" y="396" fill="#9cb1c6" font-family="DejaVu Sans,Arial" font-size="11" font-weight="400">Роль</text><rect x="564" y="404" width="511" height="33" rx="4" fill="#101827" stroke="#34475a"/><text x="576" y="426" fill="#edf5fb" font-family="DejaVu Sans,Arial" font-size="12" font-weight="400">Главный объект</text><text x="564" y="450" fill="#9cb1c6" font-family="DejaVu Sans,Arial" font-size="11" font-weight="400">Название</text><rect x="564" y="458" width="511" height="33" rx="4" fill="#101827" stroke="#34475a"/><text x="576" y="480" fill="#edf5fb" font-family="DejaVu Sans,Arial" font-size="12" font-weight="400">Медвежонок с подарком</text><text x="564" y="504" fill="#9cb1c6" font-family="DejaVu Sans,Arial" font-size="11" font-weight="400">Действие / поза</text><rect x="564" y="512" width="511" height="33" rx="4" fill="#101827" stroke="#34475a"/><text x="576" y="534" fill="#edf5fb" font-family="DejaVu Sans,Arial" font-size="12" font-weight="400">Сидит, держит подарок</text><rect x="564" y="577" width="17" height="17" rx="3" fill="#1f2a3a" stroke="#34475a"/><text x="592" y="591" fill="#edf5fb" font-family="DejaVu Sans,Arial" font-size="11" font-weight="400">Сохранить эту идею при повторном подборе</text><rect x="564" y="622" width="511" height="39" rx="4" fill="#1f2a3a" stroke="#34475a"/><text x="716" y="648" fill="#edf5fb" font-family="DejaVu Sans,Arial" font-size="12" font-weight="400">Перегенерировать эту идею</text></svg>