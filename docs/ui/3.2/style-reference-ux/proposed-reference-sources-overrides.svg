<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="780" viewBox="0 0 1120 780"><rect x="0" y="0" width="1120" height="780" rx="0" fill="#101827" stroke="#101827"/><rect x="12" y="12" width="1096" height="66" rx="8" fill="#1f2a3a" stroke="#34475a"/><text x="32" y="53" fill="#edf5fb" font-family="DejaVu Sans,Arial" font-size="22" font-weight="700">Автоматический Clipart</text><text x="790" y="51" fill="#edf5fb" font-family="DejaVu Sans,Arial" font-size="13" font-weight="400">Главная Studio       Настройки API</text><rect x="12" y="92" width="224" height="630" rx="8" fill="#1f2a3a" stroke="#34475a"/><text x="30" y="125" fill="#edf5fb" font-family="DejaVu Sans,Arial" font-size="18" font-weight="700">Шаги</text><text x="31" y="156" fill="#9cb1c6" font-family="DejaVu Sans,Arial" font-size="13" font-weight="400">○ 1. Идея</text><text x="31" y="195" fill="#9cb1c6" font-family="DejaVu Sans,Arial" font-size="13" font-weight="400">○ 2. Визуальное направление</text><text x="31" y="234" fill="#22c8b8" font-family="DejaVu Sans,Arial" font-size="13" font-weight="700">● 3. Референсы</text><text x="31" y="273" fill="#9cb1c6" font-family="DejaVu Sans,Arial" font-size="13" font-weight="400">○ 4. Структура набора</text><text x="31" y="312" fill="#9cb1c6" font-family="DejaVu Sans,Arial" font-size="13" font-weight="400">○ 5. Объекты</text><text x="31" y="351" fill="#9cb1c6" font-family="DejaVu Sans,Arial" font-size="13" font-weight="400">○ 6. Промпты и запуск</text><rect x="12" y="735" width="1096" height="36" rx="8" fill="#1f2a3a" stroke="#34475a"/><text x="933" y="759" fill="#edf5fb" font-family="DejaVu Sans,Arial" font-size="13" font-weight="400">Назад</text><rect x="1021" y="740" width="74" height="26" rx="5" fill="#22c8b8" stroke="#22c8b8"/><text x="1035" y="758" fill="#09221f" font-family="DejaVu Sans,Arial" font-size="13" font-weight="700">Далее</text><text x="260" y="121" fill="#edf5fb" font-family="DejaVu Sans,Arial" font-size="20" font-weight="700">Референсы</text><text x="260" y="145" fill="#9cb1c6" font-family="DejaVu Sans,Arial" font-size="11" font-weight="400">Необязательный шаг. Добавление изображения само не меняет выбранные стиль и палитру.</text><rect x="260" y="160" width="222" height="500" rx="8" fill="#1f2a3a" stroke="#34475a"/><text x="277" y="188" fill="#edf5fb" font-family="DejaVu Sans,Arial" font-size="14" font-weight="700">Изображения · 1</text><rect x="272" y="204" width="198" height="62" rx="4" fill="#29433e" stroke="#22c8b8"/><text x="283" y="230" fill="#edf5fb" font-family="DejaVu Sans,Arial" font-size="11" font-weight="400">▣ winter-bear.png</text><text x="283" y="249" fill="#9cb1c6" font-family="DejaVu Sans,Arial" font-size="10" font-weight="400">Выбрано</text><rect x="273" y="573" width="196" height="34" rx="4" fill="#1f2a3a" stroke="#34475a"/><text x="289" y="596" fill="#edf5fb" font-family="DejaVu Sans,Arial" font-size="11" font-weight="400">Добавить изображения</text><rect x="273" y="617" width="196" height="34" rx="4" fill="#1f2a3a" stroke="#34475a"/><text x="303" y="639" fill="#edf5fb" font-family="DejaVu Sans,Arial" font-size="11" font-weight="400">Удалить из набора</text><rect x="496" y="160" width="598" height="500" rx="8" fill="#1f2a3a" stroke="#34475a"/><rect x="510" y="174" width="104" height="112" rx="3" fill="#e3dac9" stroke="#e3dac9"/><circle cx="562" cy="224" r="28" fill="#9a775a"/><circle cx="535" cy="202" r="12" fill="#9a775a"/><circle cx="589" cy="202" r="12" fill="#9a775a"/><text x="630" y="195" fill="#edf5fb" font-family="DejaVu Sans,Arial" font-size="13" font-weight="700">winter-bear.png</text><text x="630" y="217" fill="#9cb1c6" font-family="DejaVu Sans,Arial" font-size="10" font-weight="400">PNG · 1086 × 1448 · 2,2 МБ</text><text x="630" y="248" fill="#edf5fb" font-family="DejaVu Sans,Arial" font-size="12" font-weight="700">Использовать этот референс</text><rect x="630" y="259" width="16" height="16" rx="3" fill="#22c8b8" stroke="#22c8b8"/><text x="633" y="272" fill="#09221f" font-fa