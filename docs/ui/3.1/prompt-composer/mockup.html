<style>
*{box-sizing:border-box}body{margin:0;background:#0f1725;color:#edf3fc;font:14px/1.45 Arial,sans-serif}button,input,select,textarea{font:inherit}button,select{cursor:pointer}button:disabled{cursor:default;opacity:.5}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #62b6ff;outline-offset:2px}button{min-height:36px;border:1px solid #344458;background:#202c3b;color:#edf3fc;border-radius:8px;padding:7px 13px;font-weight:600}button:hover:not(:disabled){background:#293b4e}button.primary{background:#24c6b3;border-color:#24c6b3;color:#082b2b}button.primary:hover{background:#53d3c3}button.active{background:#183e45;border-color:#26c5b8;color:#5de2d2}button.link{background:transparent;border-color:transparent;color:#7edbd2}button.quiet{background:transparent}button.small{min-height:30px;padding:4px 10px;font-size:12px}input,select,textarea{width:100%;border:1px solid #405066;background:#131f2e;color:#edf3fc;border-radius:7px;padding:9px 11px;min-height:38px}textarea{resize:vertical;min-height:76px;line-height:1.6}input[type=checkbox]{width:16px;height:16px;min-height:0;accent-color:#24c6b3}label{display:block}h1,h2,h3,p{margin:0}h1{font-size:25px;letter-spacing:-.4px}h2{font-size:19px}h3{font-size:15px}p{margin-top:6px}.muted{color:#a6b8cd}.tiny{font-size:12px}.teal{color:#65dfd1}.grow{flex:1}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.stack{display:grid;gap:15px}.field{display:grid;gap:7px}.field>span,.field>.row{color:#c3d0e0;font-size:13px}.chips{display:flex;gap:8px;flex-wrap:wrap}.badge{display:inline-block;color:#a9c1d6;background:#18283b;border:1px solid #344458;border-radius:6px;padding:3px 7px;font-size:12px}.badge.good{color:#6cddcb;border-color:#35645d;background:#173b39}.panel{background:#1f2a39;border:1px solid #344458;border-radius:10px;padding:19px}.subpanel{background:#172232;border:1px solid #344458;border-radius:8px;padding:14px}.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:15px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 286px;gap:18px;align-items:start}.notice{border:1px solid #665936;background:#302a20;border-radius:8px;padding:12px;color:#f1d9a6}.notice.info{background:#192e42;border-color:#3a526d;color:#c1d6ed}.notice.error{background:#34242b;border-color:#86505a;color:#f4c1ca}.divider{height:1px;background:#344458;margin:14px 0}.label{font-size:12px;color:#a6b8cd;letter-spacing:.6px;text-transform:uppercase}.app{height:742px;display:flex;flex-direction:column;position:relative;max-width:1400px;margin:0 auto}.topbar{height:56px;flex-shrink:0;padding:0 24px;background:#131f2e;border-bottom:1px solid #2b3b4e;display:flex;align-items:center;gap:26px}.brand{font-weight:700;font-size:20px;white-space:nowrap}.crumb{color:#50cfc5}.heading{padding:18px 24px 0;display:flex;justify-content:space-between;align-items:center;gap:12px}.tabs{padding:14px 24px 0;display:flex;gap:6px}.tabs button{border-bottom-left-radius:0;border-bottom-right-radius:0}.steps{padding:12px 24px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:9px}.steps button{font-size:13px;text-align:left;font-weight:400}.steps button.active{font-weight:600}.content{flex:1;overflow:auto;min-height:0;padding:5px 24px 18px;scrollbar-color:#516176 #131f2e;scrollbar-width:thin}.footer{flex-shrink:0;min-height:67px;border-top:1px solid #2b3b4e;padding:13px 24px;background:#111c2b;display:flex;align-items:center;gap:12px}.mockbar{height:38px;border-top:1px solid #536175;background:#253140;display:flex;align-items:center;padding:3px 15px;gap:12px;color:#c3d0e0;font-size:12px}.mockbar select{width:auto;min-height:28px;padding:3px 8px;font-size:12px;max-width:340px}.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.tile{text-align:left;padding:15px;min-height:108px;font-weight:400;background:#1f2a39;display:flex;flex-direction:column;gap:7px}.tile strong{font-size:15px}.tile .motif{color:#61d9ca;letter-spacing:2px;font-size:12px}.tile span{font-size:12px;color:#abc0d6}.summary{display:grid;gap:15px}.summary .item{display:grid;gap:3px}.summary .item b{font-weight:400}.locked{font-size:11px;color:#70d4c8}.results{display:grid;grid-template-columns:310px minmax(0,1fr);gap:18px;align-items:start}.variant-list{display:grid;gap:7px}.variant{text-align:left;display:flex;gap:10px;align-items:center;min-height:47px;padding:7px 11px;font-weight:400}.variant b{font-size:13px}.variant .num{font-size:12px;border:1px solid #426072;border-radius:5px;width:25px;line-height:25px;text-align:center;flex-shrink:0}.prompt{white-space:pre-wrap;font-size:14px;line-height:1.8;background:#121f2d;border:1px solid #344458;border-radius:8px;padding:17px}.library{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.saved{display:flex;flex-direction:column;gap:10px;min-height:190px}.saved p{color:#aec0d5;font-size:13px}.saved .row:last-child{margin-top:auto}.searchrow{display:flex;gap:10px;margin-bottom:16px}.searchrow input{flex:1;min-width:130px}.searchrow select{width:160px}.empty{text-align:center;max-width:540px;margin:60px auto}.empty h2{margin:14px 0}.empty p{margin:10px 0 22px}.modalback{position:absolute;inset:0;background:#070e19b8;display:flex;align-items:center;justify-content:center;padding:24px;z-index:10}.modal{width:570px;max-width:100%;max-height:670px;overflow:auto;background:#1e2b3b;border:1px solid #536780;border-radius:12px;box-shadow:0 20px 70px #0008;padding:24px}.modal h2{font-size:22px;margin-bottom:10px}.modal .actions{margin-top:22px;display:flex;gap:9px;justify-content:flex-end;flex-wrap:wrap}.modal .stack{gap:14px}.profile-ref{min-width:82px;min-height:65px;background:#284238;border:1px solid #587566;border-radius:8px;color:#c9e4d6;display:flex;align-items:center;justify-content:center;text-align:center;font-size:12px;padding:12px}.progress{height:7px;background:#405064;border-radius:5px;overflow:hidden}.progress>span{display:block;width:38%;height:100%;background:#24c6b3}.compare{display:grid;grid-template-columns:1fr 1fr;gap:12px}.hidden{display:none!important}.toast{position:absolute;bottom:77px;left:50%;transform:translateX(-50%);padding:11px 18px;background:#245146;color:#defff7;border:1px solid #64b09a;border-radius:9px;z-index:20;max-width:90%;text-align:center}.screenreader{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
@media(max-width:800px){.layout,.results{grid-template-columns:1fr}.tiles,.library{grid-template-columns:repeat(2,minmax(0,1fr))}.heading{align-items:flex-start}.topbar{gap:12px}.crumb{display:none}.steps button{font-size:12px;padding:7px}.app{height:auto;min-height:742px}.content{overflow:visible}.modalback{position:fixed}.mockbar{height:auto;min-height:38px;flex-wrap:wrap}.footer{flex-wrap:wrap}.searchrow{flex-wrap:wrap}}
@media(max-width:480px){.tiles,.library,.two,.compare{grid-template-columns:1fr}.topbar{padding:10px 14px;height:auto;flex-wrap:wrap}.heading{padding:14px;flex-wrap:wrap}.tabs,.steps{padding:8px 14px}.content{padding:10px 14px}.steps{grid-template-columns:repeat(3,1fr)}.mockbar .optional{display:none}.modal{padding:18px}.searchrow select{width:100%}}

<body>
<div id="app" class="app"></div>
<div class="mockbar"><b>Макет для согласования</b><label for="screen" class="screenreader">Состояние макета</label><select id="screen"></select><span class="grow optional"></span><span class="optional">Демо-данные · без API и сохранения на диск</span></div>
<script>
(()=>{
const app=document.getElementById('app'), picker=document.getElementById('screen');
const screens={templates:'Шаблоны',subject:'Кто и что в кадре',person:'Герой · человек',advanced:'Дополнительная постановка',details:'Детали',scene:'Сцена · изображение',reels:'Сцена · Reels',results:'Семь вариантов',library:'Сохранённые',empty:'Пустая библиотека',saved:'Повторное открытие',edit:'Ручная правка',profile:'Профиль и референсы',custom:'Своё значение и перевод',confirm:'AI · модель и цена',unknown:'AI · неизвестная цена',noai:'AI · нет подключения',loading:'AI · запрос выполняется',error:'AI · ошибка',aipreview:'AI · 7 предложений',partial:'AI · 3 предложения',insufficient:'AI · только 3 варианта',conflict:'Конфликт закреплений',stale:'AI · черновик уже изменён',handoff:'Передача ручного текста',save:'Сохранение',unsaved:'Несохранённые изменения',delete:'Удаление записи',catalog:'Дополнительные шаблоны'};
const titles=['Мягкий свет у окна','На столе мастерской','Льняная фактура','Вид сверху','В вечернем свете','Деталь глазури','На открытой полке'];
const en=['A handmade sage-green ceramic mug on a light oak table beside a window. Soft side daylight, three-quarter view, linen textile in the background. Preserve the mug shape and glaze color. Natural product photography, gentle shadows, clean composition. No lettering, logos, extra handles or hands.','A handmade sage-green ceramic mug on a tidy pottery workbench. Diffused daylight, eye-level view, a small brush and folded cloth in the background. Preserve the mug shape and glaze color. Natural product photography. No lettering, logos, extra handles or hands.','A handmade sage-green ceramic mug on warm ivory linen. Close product composition, soft reflected daylight, shallow depth of field. Preserve the mug shape and glaze color. Natural product photography. No lettering, logos, extra handles or hands.','Top-down product photograph of a handmade sage-green ceramic mug on light wood, surrounded by generous empty space. Soft even daylight. Preserve the mug shape and glaze color. No lettering, logos, extra handles or hands.','A handmade sage-green ceramic mug on a wooden side table in warm evening light. Low camera angle, quiet neutral background, gentle long shadows. Preserve the mug shape and glaze color. No lettering, logos, extra handles or hands.','Close-up product photograph of the glaze texture on a handmade sage-green ceramic mug. The curved rim stays visible, with a simple neutral backdrop and soft raking light. Preserve the mug shape and glaze color. No lettering or logos.','A handmade sage-green ceramic mug on an open wooden kitchen shelf. Eye-level composition, soft indirect morning light, a single folded linen napkin nearby. Preserve the mug shape and glaze color. No lettering, logos, extra handles or hands.'];
const ru=['Керамическая чашка шалфейного цвета на светлом дубовом столе у окна. Мягкий боковой дневной свет, ракурс три четверти, льняная ткань на фоне. Сохранить форму чашки и цвет глазури. Естественная предметная фотография, мягкие тени, чистая композиция. Без надписей, логотипов, лишних ручек и рук.','Та же чашка на аккуратном столе гончарной мастерской. Рассеянный дневной свет, камера на уровне предмета, на заднем плане небольшая кисть и сложенная ткань. Сохранить форму и цвет глазури. Без надписей, логотипов, лишних ручек и рук.','Чашка на льняной ткани цвета слоновой кости. Крупная предметная композиция, мягкий отражённый дневной свет, небольшая глубина резкости. Сохранить форму и цвет глазури. Без надписей, логотипов, лишних ручек и рук.','Предметная фотография чашки строго сверху на светлом дереве. Много свободного пространства, мягкий равномерный дневной свет. Сохранить форму и цвет глазури. Без надписей, логотипов, лишних ручек и рук.','Чашка на деревянном столике в тёплом вечернем свете. Низкий ракурс, спокойный нейтральный фон, мягкие длинные тени. Сохранить форму и цвет глазури. Без надписей, логотипов, лишних ручек и рук.','Крупный план фактуры глазури чашки: виден изогнутый край, простой нейтральный фон и мягкий скользящий свет. Сохранить форму и цвет глазури. Без надписей и логотипов.','Чашка на открытой деревянной кухонной полке. Камера на уровне предмета, мягкий непрямой утренний свет, рядом одна сложенная льняная салфетка. Сохранить форму и цвет глазури. Без надписей, логотипов, лишних ручек и рук.'];
const extraImage=['Товар на бумажном подиуме','Ботанический натюрморт','Питомец у окна','Иллюстрация для открытки','Фактура ручной работы','Портрет в мастерской','Десерт в контровом свете'];
const extraReels=['Чашка поворачивается в руке','Ткань колышется у окна','Лепесток падает на стол','Ложка размешивает какао','Кисть касается бумаги','Кот медленно моргает','Капля стекает по флакону'];
let state=new URLSearchParams(location.search).get('state')||'templates', variant=0, lang='en', mode='image', custom=false, toastTimer;
if(!screens[state])state='templates';
if(state==='reels')mode='reels';
picker.innerHTML=Object.entries(screens).map(([v,l])=>`<option value="${v}">${l}</option>`).join('');
const button=(label,go,cls='')=>`<button class="${cls}" type="button" data-go="${go}">${label}</button>`;
const chips=(vals,sel=0)=>`<div class="chips">${vals.map((v,i)=>`<button type="button" class="${i===sel?'active':''}" data-chip aria-pressed="${i===sel}">${v}</button>`).join('')}</div>`;
const lock=()=>'<button class="small active" type="button" data-lock aria-pressed="true">Закреплено</button>';
function summary(){return `<aside class="panel summary"><h3>Ваша сцена</h3><div class="item"><span class="muted tiny">Герой / предмет</span><b>Керамическая чашка</b><span class="locked">Форма и цвет закреплены</span></div><div class="item"><span class="muted tiny">Подача</span><b>Естественная фотография</b></div><div class="item"><span class="muted tiny">Место</span><b>Стол у окна</b></div><div class="item"><span class="muted tiny">${mode==='reels'?'Действие':'Композиция'}</span><b>${mode==='reels'?'Рука плавно поворачивает чашку':'Ракурс три четверти'}</b></div><div class="divider"></div><p class="muted tiny">Меняются только незакреплённые параметры. Референсы не отправляются AI-помощнику.</p>${button('Профиль и референсы','profile','quiet small')}</aside>`}
function templates(){return `<div class="stack"><div class="row between"><div><h2>С чего начнём?</h2><p class="muted">Выберите готовую основу или соберите собственную сцену.</p></div>${button('Начать с нуля','subject','quiet')}</div><div class="row">${button('Изображение','scene',mode==='image'?'active':'')}${button('Reels · одна сцена','reels',mode==='reels'?'active':'')}<span class="grow"></span>${button('Дополнительные шаблоны','catalog','link')}</div><div class="tiles">${[['ПОРТРЕТ','Утренний образ','Мягкий свет и повседневная сцена'],['ПОРТРЕТ','Мужчина в деле','Естественный жест и окружение'],['ПОРТРЕТ','Зрелая аудитория','Характер и спокойная подача'],['ПОРТРЕТ','Живой портрет','Один герой, одно действие'],['ПРЕДМЕТ','Товар в жизни','Естественный свет и окружение'],['ПРЕДМЕТ','Распаковка товара','Открытие коробки одним действием'],['ПЕРСОНАЖ','Мини-история персонажа','Одно простое действие без смены сцен']].map(([tag,title,sub])=>`<button class="tile" type="button" data-go="subject"><span class="motif">${tag}</span><strong>${title}</strong><span>${sub}</span></button>`).join('')}</div><div class="notice info">Встроенные шаблоны работают без AI. Каждый результат можно сохранить и изменить позже.</div></div>`}
function subject(){return `<div class="layout"><div class="panel stack"><div class="row between"><h2>Кто или что в кадре</h2>${button('Выбрать профиль','profile','quiet small')}</div>${chips(['Человек','Персонаж','Животное','Товар','Предмет','Место'],3)}<label class="field"><span class="row between">Предмет ${lock()}</span><input aria-label="Описание предмета" value="Керамическая чашка ручной работы"></label><div class="two"><label class="field"><span>Материал</span><input value="Керамика" aria-label="Материал"></label><label class="field"><span class="row between">Цвет ${lock()}</span><input value="Шалфейный" aria-label="Цвет"></label></div><label class="field"><span>Что обязательно сохранить</span><textarea aria-label="Особенности предмета">Округлая форма, одна широкая ручка, матовая глазурь.</textarea></label><div class="row">${button('Сохранить профиль','profile','quiet')}${button('Добавить своё значение','custom','link')}</div></div>${summary()}</div>`}
function person(){return `<div class="layout"><div class="panel stack"><div class="row between"><h2>Герой в кадре</h2>${button('Выбрать профиль','profile','quiet small')}</div>${chips(['Человек','Персонаж','Животное','Товар','Предмет','Место'])}<div class="two"><label class="field"><span>Возрастная группа</span><select aria-label="Возрастная группа"><option>Взрослый</option><option>Зрелый взрослый</option><option>Пожилой человек</option></select></label><label class="field"><span>Образ</span><input aria-label="Образ героя" value="Художница в своей мастерской"></label></div><label class="field"><span class="row between">Внешность ${lock()}</span><input aria-label="Внешность" value="Волнистые каштановые волосы, естественная кожа"></label><label class="field"><span>Одежда и аксессуары</span><input aria-label="Одежда" value="Светлая льняная рубашка, фартук"></label><label class="field"><span>Характер и настроение</span><input aria-label="Характер" value="Спокойная, сосредоточенная на работе"></label><p class="muted tiny">Для персонажа, животного и предмета будут свои подходящие поля.</p></div><aside class="panel stack"><h3>Постоянный образ</h3><p class="muted">Закрепите внешность и используйте профиль в следующих сценах.</p>${button('Сохранить профиль','profile','quiet')}<div class="notice info">Профиль сохраняет описание. Точность сходства в изображениях зависит от генератора.</div></aside></div>`}
function details(){return `<div class="layout"><div class="panel stack"><h2>Детали и атмосфера</h2><div class="field"><span>Место</span>${chips(['У окна','В мастерской','На полке','На улице','Своё'])}</div><div class="field"><span>Поверхность</span>${chips(['Светлое дерево','Лён','Камень','Бумага'])}</div><div class="field"><span>Стиль</span>${chips(['Естественное фото','Каталог','Редакционный','Акварель'])}</div><div class="field"><span>Освещение</span>${chips(['Дневной свет','Вечерний','Рассеянный','Контровой'])}</div><div class="field"><span>Дополнения</span>${chips(['Без дополнений','Салфетка','Сухоцветы','Книга'])}</div><div class="row">${button('Время, камера и подача','advanced','quiet')}${button('Случайные параметры','details','quiet')}<span class="muted tiny">Закреплённое останется прежним</span></div></div>${summary()}</div>`}
function scene(reel=false){return `<div class="layout"><div class="panel stack"><div class="row between"><h2>${reel?'Одна сцена с действием':'Постановка кадра'}</h2><span class="badge">${reel?'Reels · 9:16':'Изображение'}</span></div><div class="row">${button('Изображение','scene',!reel?'active':'')}${button('Reels','reels',reel?'active':'')}</div>${reel?`<label class="field"><span>Что происходит</span><textarea aria-label="Действие сцены">Рука медленно поворачивает чашку, показывая форму и фактуру глазури. Одна непрерывная сцена.</textarea></label><div class="two"><label class="field"><span>Камера</span><select aria-label="Движение камеры"><option>Неподвижная</option><option>Медленный наезд</option><option>Плавное движение вбок</option></select></label><label class="field"><span>Желаемая длительность</span><select aria-label="Желаемая длительность"><option>6 секунд</option><option>8 секунд</option><option>10 секунд</option></select></label></div><p class="muted tiny">Доступная длительность зависит от видеомодели. Здесь создаётся только промпт.</p>`:`<div class="field"><span>Крупность</span>${chips(['Предмет целиком','Крупный план','Общий план'])}</div><div class="field"><span>Ракурс</span>${chips(['Три четверти','На уровне предмета','Сверху','Снизу'])}</div><div class="field"><span>Формат изображения</span>${chips(['1:1','4:5','9:16','16:9'])}</div>`}<label class="field"><span>Что исключить</span><input aria-label="Исключения" value="Надписи, логотипы, лишние ручки${reel?'':', руки'}"></label><div class="notice info">${reel?'Каждый из 7 вариантов описывает одно действие в одной сцене.':'Получите 7 вариантов. Форма предмета и цвет сохранятся.'}</div></div>${summary()}</div>`}
function result(){const proposed=['aipreview','partial'].includes(state),count=state==='partial'?3:7; if(variant>=count)variant=0;const reel=mode==='reels';let text=lang==='en'?en[variant]:ru[variant];if(reel)text=lang==='en'?`One continuous vertical 9:16 shot, about 6 seconds. A hand slowly turns a handmade sage-green ceramic mug on a light oak table. ${['Soft side daylight beside a window.','Diffused daylight in a pottery studio.','Warm reflected light over ivory linen.','Soft overhead light and clean framing.','Warm evening light and long shadows.','Close framing highlights the glaze texture.','A kitchen shelf remains softly blurred behind.'][variant]} The camera stays still. Preserve the mug shape, single handle and glaze color. No scene cuts, lettering or logos.`:`Один непрерывный вертикальный кадр 9:16, около 6 секунд. Рука медленно поворачивает чашку шалфейного цвета на светлом дубовом столе. ${['Мягкий боковой дневной свет у окна.','Рассеянный дневной свет в гончарной мастерской.','Тёплый отражённый свет над тканью цвета слоновой кости.','Мягкий свет сверху и чистая композиция.','Тёплый вечерний свет и длинные тени.','Крупный кадр подчёркивает фактуру глазури.','Кухонная полка мягко размыта на заднем плане.'][variant]} Камера неподвижна. Сохранить форму чашки, одну ручку и цвет глазури. Без смены сцен, надписей и логотипов.`;

function render(){picker.value=state;const isLibrary=['library','empty','saved','delete'].includes(state);let content,step=0;if(['subject','person'].includes(state))step=1;if(['details','advanced','custom','profile'].includes(state))step=2;if(['scene','reels'].includes(state))step=3;if(!['templates','subject','person','details','advanced','custom','profile','scene','reels','catalog'].includes(state))step=4;const overlayState=!['templates','subject','person','details','scene','reels','results','library','empty','catalog','aipreview','partial'].includes(state);
if(state==='templates')content=templates();else if(state==='subject')content=subject();else if(state==='person')content=person();else if(['details','advanced','custom'].includes(state))content=details();else if(state==='profile')content=subject();else if(state==='scene'||state==='reels')content=scene(state==='reels');else if(isLibrary)content=library(state==='empty');else if(state==='catalog')content=catalog();else content=result();
app.innerHTML=`<header class="topbar"><span class="brand">VIBIX Studio</span><span class="crumb">Конструктор промптов</span><span class="grow"></span>${button('Каталог Studio','home','quiet small')}${button('Настройки AI','settings','quiet small')}</header><div class="heading"><div><h1>Конструктор промптов</h1><p class="muted">От идеи до готового промпта. Сохраняйте удачные варианты и меняйте детали.</p></div><span class="badge">${isLibrary?'Ваша библиотека':'Черновик'}</span></div><nav class="tabs" aria-label="Разделы модуля">${button('Конструктор','templates',!isLibrary?'active':'')}${button('Сохранённые промпты','library',isLibrary?'active':'')}</nav>${isLibrary?'<div style="height:18px"></div>':`<nav class="steps" aria-label="Шаги конструктора">${['Шаблон','Кто / что в кадре','Детали','Сцена','Готовые промпты'].map((l,i)=>button(`${i+1}  ${l}`,['templates','subject','details',mode==='reels'?'reels':'scene','results'][i],i===step?'active':'')).join('')}</nav>`}<main class="content">${content}</main><footer class="footer">${isLibrary?`${button('Новый промпт','templates','primary')}<span class="grow"></span><span class="muted tiny">Локально · настройки сохраняются вместе с текстом</span>`:step===4?`${button('Ещё 7 вариантов','another','quiet')}${button('Предложить с AI…','confirm','quiet')}<span class="grow"></span><span class="muted tiny">Локальная сборка без расходов на AI</span>`:`${button(step?'Назад':'Сохранённые',step?['templates','templates','subject','details'][step]:'library','quiet')}<span class="grow"></span><span class="muted tiny">${step===3?'Создаётся текст, не изображение или видео':'Настройки можно изменить на любом шаге'}</span>${button(step===3?'Получить 7 вариантов':'Далее',step===3?'results':['subject','details',mode==='reels'?'reels':'scene'][step],'primary')}`}</footer>${overlayState?overlay():''}`;
const search=document.getElementById('search');if(search)search.addEventListener('input',filter);const type=document.getElementById('filter');if(type)type.addEventListener('change',filter);const only=document.getElementById('only-favorites');if(only)only.onclick=()=>{only.setAttribute('aria-pressed',only.getAttribute('aria-pressed')!=='true');only.classList.toggle('active');filter()};
app.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.go)));app.querySelectorAll('[data-variant]').forEach(b=>b.addEventListener('click',()=>{variant=Number(b.dataset.variant);render()}));app.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>{lang=b.dataset.lang;render()}));app.querySelectorAll('[data-chip]').forEach(b=>b.addEventListener('click',()=>{b.parentElement.querySelectorAll('button').forEach(s=>{s.classList.remove('active');s.setAttribute('aria-pressed','false')});b.classList.add('active');b.setAttribute('aria-pressed','true');if(b.textContent==='Человек')go('person');if(b.textContent==='Товар')go('subject')}));app.querySelectorAll('[data-lock]').forEach(b=>b.addEventListener('click',()=>{const on=b.getAttribute('aria-pressed')==='true';b.setAttribute('aria-pressed',!on);b.classList.toggle('active',!on);b.textContent=on?'Закрепить':'Закреплено'}));
const manual=document.getElementById('manual-prompt');if(manual)manual.addEventListener('input',()=>custom=true);}
function filter(){const q=document.getElementById('search').value.toLowerCase(),kind=document.getElementById('filter').value,fav=document.getElementById('only-favorites').getAttribute('aria-pressed')==='true';let count=0;document.querySelectorAll('[data-title]').forEach(c=>{const show=c.dataset.title.includes(q)&&(kind==='all'||c.dataset.kind===kind)&&(!fav||c.dataset.fav==='true');c.classList.toggle('hidden',!show);if(show)count++});document.getElementById('no-match').classList.toggle('hidden',count>0)}
function toast(s){app.querySelector('.toast')?.remove();const e=document.createElement('div');e.className='toast';e.setAttribute('role','status');e.textContent=s;app.appendChild(e);clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.remove(),3500)}
function go(s){if(s==='accept'){state='results';render();toast('Принятие варианта показано на демо-данных.');return}if(s==='copy'){toast('В приложении будет скопирован текущий текст. Это макет.');return}if(s==='favorite'){toast('В макете показано добавление в избранное.');return}if(s==='settings'){go('noai');return}if(s==='home'){toast('Здесь будет возврат к каталогу Studio.');return}if(s==='reference'){toast('В приложении откроется выбор локального файла.');return}if(s==='manual-ru'){const area=document.getElementById('manual-prompt');area.value=ru[variant];area.setAttribute('aria-label','Русский вариант для редактирования');return}if(s==='replace'){app.insertAdjacentHTML('beforeend',modal('Заменить «Чашка у окна»?','<p>Исходная запись будет обновлена текущим текстом и настройками.</p>',button('Отмена','save','quiet')+button('Подтвердить замену','save-done','primary')));app.querySelectorAll('.modalback:last-child [data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));return}if(s==='another'){variant=(variant+1)%7;state='results';render();toast('Макет показывает переключение варианта. Новая генерация не выполняется.');return}let message='';if(s==='save-done'){s='library';message='Сохранение показано на демо-данных. Файл не записывался.'}if(s==='delete-done'){s='empty';message='Демонстрация состояния после удаления.'}if(s==='handoff-done'){s='results';message='Демонстрация передачи в черновик. Генерация не запускалась.'}if(s==='reels')mode='reels';if(s==='scene')mode='image';if(s==='saved')mode='image';state=s;render();if(message)toast(message)}
picker.addEventListener('change',()=>go(picker.value));render();
})();
</script>
</body>
</html>
