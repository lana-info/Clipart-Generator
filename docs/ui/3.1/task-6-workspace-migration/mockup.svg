<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="780" viewBox="0 0 1120 780">
  <style>
    .canvas{fill:#101827}.surface{fill:#1f2937;stroke:#304054;stroke-width:1}
    .muted-surface{fill:#273549;stroke:#304054;stroke-width:1}
    .selected{fill:#12363f;stroke:#2dd4bf;stroke-width:2}
    .notice{fill:#162f3a;stroke:#2f6571;stroke-width:1}
    .text{font-family:"Segoe UI",Arial,sans-serif;fill:#e5eef7}
    .muted{font-family:"Segoe UI",Arial,sans-serif;fill:#92a2b3}
    .accent{font-family:"Segoe UI",Arial,sans-serif;fill:#2dd4bf}
    .title{font-family:"Segoe UI",Arial,sans-serif;fill:#e5eef7;font-size:23px;font-weight:600}
    .heading{font-family:"Segoe UI",Arial,sans-serif;fill:#e5eef7;font-size:16px;font-weight:600}
    .body{font-family:"Segoe UI",Arial,sans-serif;fill:#e5eef7;font-size:14px}
    .small{font-family:"Segoe UI",Arial,sans-serif;fill:#92a2b3;font-size:12px}
    .button{fill:#2dd4bf}.button-text{font-family:"Segoe UI",Arial,sans-serif;fill:#0d2428;font-size:14px;font-weight:600}
  </style>

  <rect class="canvas" width="1120" height="780"/>

  <rect class="surface" x="24" y="24" width="1072" height="64" rx="8"/>
  <rect x="44" y="40" width="32" height="32" rx="8" fill="#2dd4bf"/>
  <path d="M53 49 L60 64 L67 49" fill="none" stroke="#0d2428" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="heading" x="88" y="64">Vibix Images</text>
  <text class="small" x="88" y="78">Клипарт</text>
  <text class="body" x="868" y="63">Сменить режим</text>
  <text class="body" x="990" y="63">Настройки API</text>

  <rect class="surface" x="24" y="104" width="218" height="590" rx="8"/>
  <text class="heading" x="44" y="138">Шаги</text>
  <rect x="36" y="156" width="194" height="44" rx="8" fill="#12363f"/>
  <circle cx="56" cy="178" r="10" fill="#2dd4bf"/>
  <text x="53" y="182" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#0d2428">1</text>
  <text class="text" x="76" y="183" font-size="14" font-weight="600">Рабочая папка</text>
  <circle cx="56" cy="224" r="10" fill="#273549" stroke="#52657a"/>
  <text class="muted" x="53" y="228" font-size="12">2</text>
  <text class="muted" x="76" y="229" font-size="14">Промпты</text>
  <circle cx="56" cy="270" r="10" fill="#273549" stroke="#52657a"/>
  <text class="muted" x="53" y="274" font-size="12">3</text>
  <text class="muted" x="76" y="275" font-size="14">Проверка промптов</text>
  <circle cx="56" cy="316" r="10" fill="#273549" stroke="#52657a"/>
  <text class="muted" x="53" y="320" font-size="12">4</text>
  <text class="muted" x="76" y="321" font-size="14">Генерация</text>
  <circle cx="56" cy="362" r="10" fill="#273549" stroke="#52657a"/>
  <text class="muted" x="53" y="366" font-size="12">5</text>
  <text class="muted" x="76" y="367" font-size="14">Обработка</text>
  <circle cx="56" cy="408" r="10" fill="#273549" stroke="#52657a"/>
  <text class="muted" x="53" y="412" font-size="12">6</text>
  <text class="muted" x="76" y="413" font-size="14">Проверка и запуск</text>
  <circle cx="56" cy="454" r="10" fill="#273549" stroke="#52657a"/>
  <text class="muted" x="53" y="458" font-size="12">7</text>
  <text class="muted" x="76" y="459" font-size="14">Результаты</text>

  <text class="title" x="270" y="135">Обновление рабочей папки</text>
  <rect x="838" y="112" width="234" height="28" rx="14" fill="#273549"/>
  <text class="small" x="858" y="131" fill="#b8c7d8">Однократно после обновления</text>
  <text class="muted" x="270" y="162" font-size="14">В версии 3.1 готовые и промежуточные изображения хранятся отдельно.</text>

  <rect class="notice" x="270" y="184" width="802" height="76" rx="8"/>
  <circle cx="298" cy="212" r="11" fill="#2dd4bf"/>
  <text x="295" y="217" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#0d2428">i</text>
  <text class="small" x="320" y="207">Ранее выбранная папка</text>
  <text class="body" x="320" y="232" font-weight="600">D:\Vibix\Exports</text>
  <text class="small" x="320" y="250">Существующие файлы останутся на месте.</text>

  <rect class="selected" x="270" y="276" width="802" height="150" rx="8"/>
  <circle cx="298" cy="304" r="10" fill="none" stroke="#2dd4bf" stroke-width="2"/>
  <circle cx="298" cy="304" r="5" fill="#2dd4bf"/>
  <text class="heading" x="320" y="310">Использовать эту папку как рабочую</text>
  <rect x="902" y="290" width="140" height="27" rx="13.5" fill="#1b5b5a"/>
  <text class="small" x="920" y="308" fill="#a7f3e8">Рекомендуется</text>
  <text class="small" x="320" y="334">Новые файлы будут разложены по папкам автоматически:</text>
  <rect class="muted-surface" x="320" y="350" width="722" height="54" rx="7"/>
  <text class="body" x="342" y="376" font-weight="600">D:\Vibix\Exports</text>
  <text class="small" x="500" y="376">├─ rough</text>
  <text class="small" x="594" y="376">├─ output</text>
  <text class="small" x="696" y="376">└─ .run</text>
  <text class="small" x="500" y="394">промежуточные</text>
  <text class="small" x="594" y="394" fill="#c8f8f1">готовые PNG</text>
  <text class="small" x="696" y="394">временные</text>

  <rect class="surface" x="270" y="442" width="802" height="100" rx="8"/>
  <circle cx="298" cy="470" r="10" fill="none" stroke="#718399" stroke-width="2"/>
  <text class="heading" x="320" y="476">Выбрать другую рабочую папку</text>
  <text class="small" x="320" y="500">Подойдёт пустая или уже существующая папка, доступная для записи.</text>
  <rect class="muted-surface" x="865" y="466" width="177" height="42" rx="8"/>
  <text class="body" x="895" y="492" font-weight="600">Выбрать папку…</text>

  <rect x="270" y="558" width="802" height="58" rx="8" fill="#202c3c" stroke="#304054"/>
  <path d="M294 577 v14 h16 v-14 l-8-5z" fill="none" stroke="#92a2b3" stroke-width="1.6" stroke-linejoin="round"/>
  <text class="body" x="326" y="582" font-weight="600">Безопасное изменение</text>
  <text class="small" x="326" y="602">Vibix ничего не переносит и не удаляет без отдельного действия.</text>

  <rect class="surface" x="24" y="710" width="1072" height="46" rx="8"/>
  <rect x="824" y="716" width="108" height="34" rx="8" fill="#273549" stroke="#304054"/>
  <text class="body" x="853" y="738">Отмена</text>
  <rect class="button" x="944" y="716" width="128" height="34" rx="8"/>
  <text class="button-text" x="970" y="738">Продолжить</text>
</svg>
