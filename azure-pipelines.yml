trigger: none
pr: none

parameters:
  - name: appVersion
    displayName: App version
    type: string
    default: '3.1.1'

pool:
  vmImage: windows-latest

steps:
  - checkout: self
    clean: true

  - task: UsePythonVersion@0
    displayName: Use Python 3.12
    inputs:
      versionSpec: '3.12'
      addToPath: true

  - powershell: |
      python -m pip install --upgrade pip
      if ($LASTEXITCODE -ne 0) { throw "pip upgrade failed with exit code $LASTEXITCODE" }
      python -m pip install -c constraints-build.txt -r requirements.txt
      if ($LASTEXITCODE -ne 0) { throw "Runtime dependency installation failed with exit code $LASTEXITCODE" }
      python -m pip install -c constraints-build.txt -r requirements-dev.txt
      if ($LASTEXITCODE -ne 0) { throw "Build dependency installation failed with exit code $LASTEXITCODE" }
    displayName: Install build dependencies

  - powershell: |
      python -m py_compile main.py
      $env:QT_QPA_PLATFORM = 'offscreen'
      python -m unittest tests.test_branding tests.test_v3_components tests.test_license_client_security tests.test_v3_license_gate tests.test_v3_license_flow_gate tests.test_v3_run_queue tests.test_v3_diagnostics tests.test_v3_project_state tests.test_v3_provider_registry tests.test_local_processing_acceptance tests.test_windows_realesrgan_bundle tests.test_release_entrypoint tests.test_license_service_contract -v
      if ($LASTEXITCODE -ne 0) { throw "Release gate tests failed with exit code $LASTEXITCODE" }
      python -m pytest -q `
        tests/test_api_credentials.py::ApiCredentialKeysTests::test_fal_key_round_trips_through_dpapi_after_store_restart `
        tests/test_update_client.py::UpdateClientTests::test_verified_installer_is_immutable_until_protected_context_closes
      if ($LASTEXITCODE -ne 0) { throw "Native Windows security contracts failed with exit code $LASTEXITCODE" }
      python scripts/check_sensitive_artifacts.py --git-tracked `
        --allow-path scripts/check_sensitive_artifacts.py `
        --allow-path tests/test_security_redaction.py
    displayName: Run offline release gates

  - powershell: |
      $archiveUrl = 'https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.5.0/realesrgan-ncnn-vulkan-20220424-windows.zip'
      $archivePath = Join-Path $env:AGENT_TEMPDIRECTORY 'realesrgan-ncnn-vulkan-20220424-windows.zip'
      $expectedSha256 = 'ABC02804E17982A3BE33675E4D471E91EA374E65B70167ABC09E31ACB412802D'
      $targetPath = '.\realesrgan-ncnn-vulkan-20211212-windows'

      Invoke-WebRequest -Uri $archiveUrl -OutFile $archivePath
      python scripts/prepare_realesrgan_runtime.py `
        --archive $archivePath `
        --target $targetPath `
        --sha256 $expectedSha256
      if ($LASTEXITCODE -ne 0) { throw "Real-ESRGAN runtime preparation failed with exit code $LASTEXITCODE" }
      Write-Host "##vso[task.setvariable variable=REAL_ESRGAN_ARCHIVE_URL]$archiveUrl"
      Write-Host "##vso[task.setvariable variable=REAL_ESRGAN_ARCHIVE_SHA256]$expectedSha256"
    displayName: Download verified Real-ESRGAN runtime

  - powershell: |
      powershell -ExecutionPolicy Bypass -File .\build.ps1 -AppVersion '${{ parameters.appVersion }}'
      if ($LASTEXITCODE -ne 0) { throw "PyInstaller build failed with exit code $LASTEXITCODE" }
    displayName: Build Windows application

  - powershell: |
      $env:QT_QPA_PLATFORM = 'offscreen'
      python -c "from PyQt6.QtWidgets import QApplication; from main import create_v3_application_window; app=QApplication([]); window=create_v3_application_window(); assert len(window.mode_selection.mode_cards) == 3; window.close(); app.quit()"
      $exe = 'dist\Vibix Images\Vibix Images.exe'
      if (-not (Test-Path -LiteralPath $exe)) { throw "Packaged executable is missing: $exe" }
      & $exe --release-entrypoint-smoke "--expected-app-version=${{ parameters.appVersion }}"
      if ($LASTEXITCODE -ne 0) { throw "Packaged release smoke failed with exit code $LASTEXITCODE" }
    displayName: Verify packaged release entrypoint

  - powershell: |
      $prerequisiteDir = '.\build-prerequisites'
      New-Item -ItemType Directory -Force -Path $prerequisiteDir | Out-Null
      $vcRedistPath = Join-Path $prerequisiteDir 'vc_redist.x64.exe'
      Invoke-WebRequest -Uri 'https://aka.ms/vc14/vc_redist.x64.exe' -OutFile $vcRedistPath
      $signature = Get-AuthenticodeSignature -FilePath $vcRedistPath
      if ($signature.Status -ne 'Valid') {
        throw "Microsoft Visual C++ runtime signature is not valid: $($signature.Status)"
      }
      if ($signature.SignerCertificate.Subject -notlike '*Microsoft Corporation*') {
        throw "Microsoft Visual C++ runtime has an unexpected signer"
      }

      choco upgrade innosetup --version=6.7.1 -y --no-progress --allow-downgrade
      $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
      if (-not (Test-Path -LiteralPath $iscc)) { throw "Inno Setup compiler is missing: $iscc" }
      & $iscc '/DAppVersion=${{ parameters.appVersion }}' '.\installer.iss'
      if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
    displayName: Build Windows installer

  - powershell: |
      powershell -ExecutionPolicy Bypass -File .\scripts\verify_installed_windows_artifact.ps1 `
        -InstallerPath '.\release\VibixImages-Setup-${{ parameters.appVersion }}.exe' `
        -ExpectedAppVersion '${{ parameters.appVersion }}' `
        -EvidenceDir '$(Build.ArtifactStagingDirectory)\ui-evidence'
      if ($LASTEXITCODE -ne 0) { throw "Installed Windows verification failed with exit code $LASTEXITCODE" }
    displayName: Verify installed Windows application

  - powershell: |
      $setupPath = 'release\VibixImages-Setup-${{ parameters.appVersion }}.exe'
      if (-not (Test-Path -LiteralPath $setupPath)) { throw "Installer is missing: $setupPath" }
      $checksumPath = 'release\VibixImages-Setup-${{ parameters.appVersion }}.sha256'
      $hash = (Get-FileHash -LiteralPath $setupPath -Algorithm SHA256).Hash
      "$hash  $(Split-Path -Leaf $setupPath)" | Out-File -FilePath $checksumPath -Encoding ascii

      $env:GITHUB_SHA = '$(Build.SourceVersion)'
      $env:INSTALLER_SHA256 = $hash
      python -m build_provenance
      python release_contract.py `
        --version-file release/VERSION.txt `
        --installer-name 'VibixImages-Setup-${{ parameters.appVersion }}.exe' `
        --executable 'dist\Vibix Images\Vibix Images.exe' `
        --checksum $checksumPath

      $staging = '$(Build.ArtifactStagingDirectory)'
      New-Item -ItemType Directory -Force -Path $staging | Out-Null
      Copy-Item -LiteralPath $setupPath, $checksumPath, 'release/VERSION.txt', 'release/build-provenance.json' -Destination $staging
    displayName: Validate and stage installer artifact

  - task: PublishPipelineArtifact@1
    displayName: Publish Windows installer
    inputs:
      targetPath: '$(Build.ArtifactStagingDirectory)'
      artifact: windows-installer
      publishLocation: pipeline
