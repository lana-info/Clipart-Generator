name: Release Windows Installer

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      app_version:
        description: "Версия релиза (пример: 0.1.1)"
        required: false
        default: ""

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve app version
        id: version
        shell: powershell
        run: |
          $inputVersion = "${{ github.event.inputs.app_version }}"
          $sourceVersion = (Get-Content -Raw "release/VERSION.txt").Trim()
          $version = if ([string]::IsNullOrWhiteSpace($inputVersion)) { $sourceVersion } else { $inputVersion }

          if ($version -notmatch '^\d+\.\d+(\.\d+)?$') {
            throw "app_version must be a semantic version such as 3.0 or 3.0.1"
          }

          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "app_version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup -y

      - name: Install dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints-build.txt -r requirements.txt
          python -m pip install -c constraints-build.txt -r requirements-dev.txt

      - name: Syntax check
        shell: powershell
        run: |
          python -m py_compile main.py
          python scripts/check_sensitive_artifacts.py --git-tracked `
            --allow-path scripts/check_sensitive_artifacts.py `
            --allow-path tests/test_security_redaction.py

      - name: Verify online license contract and V3 run gates
        shell: powershell
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          python -m unittest tests.test_license_client_security tests.test_v3_license_gate tests.test_v3_license_flow_gate tests.test_v3_run_queue tests.test_release_entrypoint tests.test_license_service_contract -v

      - name: Download bundled Local Real-ESRGAN
        shell: powershell
        run: |
          $archiveUrl = "https://github.com/xinntao/Real-ESRGAN-ncnn-vulkan/releases/download/v0.2.0/realesrgan-ncnn-vulkan-v0.2.0-windows.zip"
          $archivePath = Join-Path $env:RUNNER_TEMP "realesrgan-ncnn-vulkan-v0.2.0-windows.zip"
          $expectedSha256 = "1BBBDB12D470AF80B035C773682E144C6C2F6ECE9210832A289AF0A48CE3FA9A"
          $extractPath = Join-Path $env:RUNNER_TEMP "realesrgan"
          $targetPath = ".\realesrgan-ncnn-vulkan-20211212-windows"
          Invoke-WebRequest -Uri $archiveUrl -OutFile $archivePath
          $actualSha256 = (Get-FileHash -LiteralPath $archivePath -Algorithm SHA256).Hash
          if ($actualSha256 -ne $expectedSha256) {
            throw "Real-ESRGAN archive SHA-256 mismatch: $actualSha256"
          }
          Expand-Archive -LiteralPath $archivePath -DestinationPath $extractPath -Force
          $exe = Get-ChildItem -LiteralPath $extractPath -Recurse -Filter "realesrgan-ncnn-vulkan.exe" | Select-Object -First 1
          if (-not $exe) {
            throw "Bundled Local Real-ESRGAN executable was not found after extraction."
          }
          Copy-Item -LiteralPath $exe.Directory.FullName -Destination $targetPath -Recurse -Force
          "REAL_ESRGAN_ARCHIVE_URL=$archiveUrl" | Out-File -FilePath $env:GITHUB_ENV -Append
          "REAL_ESRGAN_ARCHIVE_SHA256=$expectedSha256" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build app (PyInstaller)
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File .\build.ps1 -AppVersion ${{ steps.version.outputs.app_version }}

      - name: Verify V3 release entrypoint
        shell: powershell
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          python -c "from PyQt6.QtWidgets import QApplication; from main import create_v3_application_window; app=QApplication([]); window=create_v3_application_window(); assert len(window.mode_selection.mode_cards) == 3; window.close(); app.quit()"
          $exe = "dist\Vibix Images\Vibix Images.exe"
          if (-not (Test-Path -LiteralPath $exe)) {
            throw "Fresh PyInstaller executable was not found: $exe"
          }
          $packagedArguments = @(
            "--release-entrypoint-smoke",
            "--expected-app-version=${{ steps.version.outputs.app_version }}"
          )
          $packagedCheck = Start-Process -FilePath $exe -ArgumentList $packagedArguments -Wait -PassThru
          if ($packagedCheck.ExitCode -ne 0) {
            throw "Packaged license startup or packaged mode artwork smoke failed with exit code $($packagedCheck.ExitCode)"
          }
          Write-Host "Fresh executable passed source, packaged license startup, and packaged mode artwork smoke checks."

      - name: Download verified Visual C++ runtime
        shell: powershell
        run: |
          $prerequisiteDir = ".\build-prerequisites"
          New-Item -ItemType Directory -Force -Path $prerequisiteDir | Out-Null
          $vcRedistPath = Join-Path $prerequisiteDir "vc_redist.x64.exe"
          Invoke-WebRequest -Uri "https://aka.ms/vc14/vc_redist.x64.exe" -OutFile $vcRedistPath
          $signature = Get-AuthenticodeSignature -FilePath $vcRedistPath
          if ($signature.Status -ne "Valid") {
            throw "Microsoft Visual C++ runtime signature is not valid: $($signature.Status)"
          }
          if ($signature.SignerCertificate.Subject -notlike "*Microsoft Corporation*") {
            throw "Microsoft Visual C++ runtime has an unexpected signer"
          }

      - name: Build Windows setup (Inno Setup)
        shell: powershell
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.version.outputs.app_version }}" ".\installer.iss"

      - name: Verify installed Windows application
        shell: powershell
        run: |
          $setupPath = "release\VibixImages-Setup-${{ steps.version.outputs.app_version }}.exe"
          $installRoot = Join-Path $env:RUNNER_TEMP "vibix-installed-smoke"
          $setupArguments = @(
            "/VERYSILENT",
            "/SUPPRESSMSGBOXES",
            "/NORESTART",
            "/DIR=$installRoot"
          )
          $setupProcess = Start-Process -FilePath $setupPath -ArgumentList $setupArguments -Wait -PassThru
          if ($setupProcess.ExitCode -ne 0) {
            throw "Installed-artifact setup failed with exit code $($setupProcess.ExitCode)"
          }
          $installedExe = Join-Path $installRoot "Vibix Images.exe"
          if (-not (Test-Path -LiteralPath $installedExe)) {
            throw "Installed executable is missing: $installedExe"
          }
          $evidenceDir = Join-Path $env:GITHUB_WORKSPACE "release\ui-evidence"
          $env:QT_QPA_PLATFORM = "windows"
          $smokeArguments = @(
            "--release-entrypoint-smoke",
            "--expected-app-version=${{ steps.version.outputs.app_version }}",
            "--ui-evidence-dir=$evidenceDir"
          )
          $smokeProcess = Start-Process -FilePath $installedExe -ArgumentList $smokeArguments -Wait -PassThru
          if ($smokeProcess.ExitCode -ne 0) {
            throw "Installed packaged mode artwork smoke failed with exit code $($smokeProcess.ExitCode)"
          }
          foreach ($evidenceName in @("mode-selection.png", "clipart-prompts.png", "clipart-prompt-review.png")) {
            $evidencePath = Join-Path $evidenceDir $evidenceName
            if (-not (Test-Path -LiteralPath $evidencePath)) {
              throw "Installed application UI evidence is missing: $evidencePath"
            }
          }

      - name: Calculate setup hash
        shell: powershell
        run: |
          $setupPath = "release\VibixImages-Setup-${{ steps.version.outputs.app_version }}.exe"
          $hash = (Get-FileHash $setupPath -Algorithm SHA256).Hash
          "$hash  $(Split-Path -Leaf $setupPath)" | Out-File -FilePath "release\VibixImages-Setup-${{ steps.version.outputs.app_version }}.sha256" -Encoding ascii
          "INSTALLER_SHA256=$hash" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Write build provenance
        shell: powershell
        run: python -m build_provenance

      - name: Validate release contract
        shell: powershell
        run: |
          python release_contract.py `
            --version-file release/VERSION.txt `
            --installer-name "VibixImages-Setup-${{ steps.version.outputs.app_version }}.exe" `
            --executable "dist\Vibix Images\Vibix Images.exe" `
            --checksum "release\VibixImages-Setup-${{ steps.version.outputs.app_version }}.sha256"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ steps.version.outputs.app_version }}
          retention-days: 3
          if-no-files-found: error
          path: |
            release/VibixImages-Setup-${{ steps.version.outputs.app_version }}.exe
            release/VibixImages-Setup-${{ steps.version.outputs.app_version }}.sha256
            release/VERSION.txt
            release/build-provenance.json
            release/ui-evidence/*.png

  build-macos:
    if: ${{ false }} # Windows-only release workflow.
    runs-on: macos-15
    env:
      APPLE_DEVELOPER_ID_APPLICATION_CERT_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_CERT_BASE64 }}
      APPLE_DEVELOPER_ID_APPLICATION_CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_CERT_PASSWORD }}
      APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
      APPLE_CODESIGN_IDENTITY: ${{ secrets.APPLE_CODESIGN_IDENTITY }}
      APPLE_NOTARY_APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
      APPLE_NOTARY_TEAM_ID: ${{ secrets.APPLE_NOTARY_TEAM_ID }}
      APPLE_NOTARY_APP_PASSWORD: ${{ secrets.APPLE_NOTARY_APP_PASSWORD }}
      PYINSTALLER_TARGET_ARCH: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve app version
        id: version
        run: |
          INPUT_VERSION="${{ github.event.inputs.app_version }}"
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="$(tr -d '\r\n' < release/VERSION.txt)"
          fi

          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "app_version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "setuptools<70"
          python -m pip install wheel
          python -m pip install numpy
          python -m pip install --no-build-isolation -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Syntax check
        run: python -m py_compile main.py

      - name: Verify online license contract and V3 run gates
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest tests.test_license_client_security tests.test_v3_license_gate tests.test_v3_license_flow_gate tests.test_v3_run_queue tests.test_release_entrypoint tests.test_license_service_contract -v

      - name: Build macOS app (PyInstaller)
        run: |
          python -m PyInstaller \
            --noconfirm \
            --clean \
            --windowed \
            --name "Clipart Generator" \
            --target-arch "$PYINSTALLER_TARGET_ARCH" \
            --add-data ".env.example:." \
            --add-data "third_party/remove_ai_watermarks_gemini/assets:third_party/remove_ai_watermarks_gemini/assets" \
            --add-data "third_party/remove_ai_watermarks_gemini/LICENSE:third_party/remove_ai_watermarks_gemini" \
            --add-data "third_party/remove_ai_watermarks_gemini/NOTICE.md:third_party/remove_ai_watermarks_gemini" \
            --add-data "third_party/migan/migan.onnx:third_party/migan" \
            --add-data "third_party/migan/LICENSE:third_party/migan" \
            --add-data "third_party/migan/NOTICE.md:third_party/migan" \
            main.py

      - name: Set macOS bundle version
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${{ steps.version.outputs.app_version }}" "dist/Clipart Generator.app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string ${{ steps.version.outputs.app_version }}" "dist/Clipart Generator.app/Contents/Info.plist"

      - name: Import Apple certificate and sign app
        if: ${{ env.APPLE_DEVELOPER_ID_APPLICATION_CERT_BASE64 != '' && env.APPLE_DEVELOPER_ID_APPLICATION_CERT_PASSWORD != '' && env.APPLE_KEYCHAIN_PASSWORD != '' && env.APPLE_CODESIGN_IDENTITY != '' }}
        env:
          CERT_BASE64: ${{ env.APPLE_DEVELOPER_ID_APPLICATION_CERT_BASE64 }}
          CERT_PASSWORD: ${{ env.APPLE_DEVELOPER_ID_APPLICATION_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ env.APPLE_KEYCHAIN_PASSWORD }}
          CODESIGN_IDENTITY: ${{ env.APPLE_CODESIGN_IDENTITY }}
        run: |
          mkdir -p certs
          echo "$CERT_BASE64" | base64 --decode > certs/developer_id_application.p12

          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain

          security import certs/developer_id_application.p12 -k build.keychain -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain

          codesign --force --deep --options runtime --timestamp --sign "$CODESIGN_IDENTITY" "dist/Clipart Generator.app"
          codesign --verify --deep --strict --verbose=2 "dist/Clipart Generator.app"

      - name: Pack macOS app to zip
        run: |
          mkdir -p release
          ditto -c -k --sequesterRsrc --keepParent "dist/Clipart Generator.app" "release/ClipartGenerator-macOS-${{ steps.version.outputs.app_version }}.zip"
          shasum -a 256 "release/ClipartGenerator-macOS-${{ steps.version.outputs.app_version }}.zip" > "release/ClipartGenerator-macOS-${{ steps.version.outputs.app_version }}.sha256"

      - name: Notarize macOS app zip and staple app
        if: ${{ env.APPLE_DEVELOPER_ID_APPLICATION_CERT_BASE64 != '' && env.APPLE_DEVELOPER_ID_APPLICATION_CERT_PASSWORD != '' && env.APPLE_KEYCHAIN_PASSWORD != '' && env.APPLE_CODESIGN_IDENTITY != '' && env.APPLE_NOTARY_APPLE_ID != '' && env.APPLE_NOTARY_TEAM_ID != '' && env.APPLE_NOTARY_APP_PASSWORD != '' }}
        env:
          NOTARY_APPLE_ID: ${{ env.APPLE_NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ env.APPLE_NOTARY_TEAM_ID }}
          NOTARY_APP_PASSWORD: ${{ env.APPLE_NOTARY_APP_PASSWORD }}
        run: |
          xcrun notarytool submit "release/ClipartGenerator-macOS-${{ steps.version.outputs.app_version }}.zip" \
            --apple-id "$NOTARY_APPLE_ID" \
            --team-id "$NOTARY_TEAM_ID" \
            --password "$NOTARY_APP_PASSWORD" \
            --wait

          xcrun stapler staple "dist/Clipart Generator.app"
          ditto -c -k --sequesterRsrc --keepParent "dist/Clipart Generator.app" "release/ClipartGenerator-macOS-${{ steps.version.outputs.app_version }}.zip"

      - name: Upload macOS artifacts
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ steps.version.outputs.app_version }}
          retention-days: 3
          path: |
            release/ClipartGenerator-macOS-${{ steps.version.outputs.app_version }}.zip
            release/ClipartGenerator-macOS-${{ steps.version.outputs.app_version }}.sha256
