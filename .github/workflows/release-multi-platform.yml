name: Release Studio Installers

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      app_version:
        description: "Версия релиза (пример: 0.1.1)"
        required: false
        default: ""
      acceptance_build:
        description: "Isolated Studio test build (separate installation, storage and server)"
        type: boolean
        default: false
      build_macos:
        description: "Also build the native Apple Silicon macOS beta"
        type: boolean
        default: false
      build_windows:
        description: "Build the Windows installer (disable for a macOS-only retry)"
        type: boolean
        default: true
      legacy_installer_url:
        description: "Optional verified 3.1.4 installer URL for production upgrade test"
        required: false
        default: ""

jobs:
  build-windows:
    if: ${{ inputs.build_windows }}
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve app version
        id: version
        shell: powershell
        run: |
          $inputVersion = "${{ github.event.inputs.app_version }}"
          $sourceVersion = (Get-Content -Raw "release/VERSION.txt").Trim()
          $version = if ([string]::IsNullOrWhiteSpace($inputVersion)) { $sourceVersion } else { $inputVersion }

          if ($version -notmatch '^\d+\.\d+(\.\d+)?$') {
            throw "app_version must be a semantic version such as 3.0 or 3.0.1"
          }

          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "app_version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          $prefix = if ("${{ inputs.acceptance_build }}" -eq "true") { "VibixImages-Test-Setup" } else { "VibixImages-Setup" }
          "INSTALLER_BASENAME=$prefix-$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $profile = if ("${{ inputs.acceptance_build }}" -eq "true") { "acceptance" } else { "production" }
          "BUILD_PROFILE=$profile" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Inno Setup
        shell: powershell
        run: choco upgrade innosetup --version=6.7.1 -y --no-progress --allow-downgrade

      - name: Install dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints-build.txt -r requirements.txt
          python -m pip install -c constraints-build.txt -r requirements-dev.txt

      - name: Syntax check
        shell: powershell
        run: |
          python -m py_compile main.py
          python scripts/check_sensitive_artifacts.py --git-tracked `
            --allow-path scripts/check_sensitive_artifacts.py `
            --allow-path tests/test_security_redaction.py

      - name: Verify online license contract and V3 run gates
        shell: powershell
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          python -m unittest tests.test_license_client_security tests.test_v3_license_gate tests.test_v3_license_flow_gate tests.test_v3_run_queue tests.test_release_entrypoint tests.test_license_service_contract -v

      - name: Verify native Windows security contracts
        shell: powershell
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          python -m pytest -q `
            tests/test_api_credentials.py::ApiCredentialKeysTests::test_fal_key_round_trips_through_dpapi_after_store_restart `
            tests/test_update_client.py::UpdateClientTests::test_verified_installer_is_immutable_until_protected_context_closes

      - name: Verify GPT Image paid-job recovery on native Windows
        shell: powershell
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          python scripts/run_isolated_tests.py -q tests/test_gpt25_recovery.py tests/test_gpt25_provider.py tests/test_provider_balance.py tests/test_gpt25_async_worker.py tests/test_gpt25_integration.py tests/test_api_settings_review_regressions.py
          if ($LASTEXITCODE -ne 0) { throw "GPT Image recovery verification failed" }

      - name: Download bundled Local Real-ESRGAN
        shell: powershell
        run: |
          $archiveUrl = "https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.5.0/realesrgan-ncnn-vulkan-20220424-windows.zip"
          $archivePath = Join-Path $env:RUNNER_TEMP "realesrgan-ncnn-vulkan-v0.2.5.0-windows.zip"
          $expectedSha256 = "ABC02804E17982A3BE33675E4D471E91EA374E65B70167ABC09E31ACB412802D"
          $targetPath = ".\realesrgan-ncnn-vulkan-20211212-windows"
          Invoke-WebRequest -Uri $archiveUrl -OutFile $archivePath
          python scripts/prepare_realesrgan_runtime.py `
            --archive $archivePath `
            --target $targetPath `
            --sha256 $expectedSha256
          "REAL_ESRGAN_ARCHIVE_URL=$archiveUrl" | Out-File -FilePath $env:GITHUB_ENV -Append
          "REAL_ESRGAN_ARCHIVE_SHA256=$expectedSha256" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Verify acceptance isolation contracts
        shell: powershell
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          python -m pytest -q tests/test_runtime_profile.py tests/test_acceptance_installer_contract.py tests/test_release_contract.py

      - name: Prepare isolated public test profile
        if: ${{ inputs.acceptance_build }}
        shell: powershell
        run: python scripts/prepare_acceptance_build.py release/acceptance-profile.json

      - name: Verify native Core catalog before packaging
        shell: powershell
        run: |
          $env:QT_QPA_PLATFORM = "windows"
          python -c "from PyQt6.QtWidgets import QApplication; from main import APP_VERSION, run_packaged_entrypoint_check; app=QApplication([]); raise SystemExit(run_packaged_entrypoint_check(APP_VERSION, evidence_dir='release/ui-evidence'))"
          if ($LASTEXITCODE -ne 0) {
            Get-Content -LiteralPath release/ui-evidence/core-smoke-report.json -ErrorAction SilentlyContinue
            throw "Native source Core smoke failed"
          }

      - name: Build app (PyInstaller)
        shell: powershell
        run: |
          if ("${{ inputs.acceptance_build }}" -eq "true") {
            powershell -ExecutionPolicy Bypass -File .\build.ps1 -AppVersion ${{ steps.version.outputs.app_version }} -AcceptanceBuild
          } else {
            powershell -ExecutionPolicy Bypass -File .\build.ps1 -AppVersion ${{ steps.version.outputs.app_version }}
          }
          if ($LASTEXITCODE -ne 0) { throw "Application build failed" }

      - name: Verify V3 release entrypoint
        shell: powershell
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          python -c "from PyQt6.QtWidgets import QApplication; from main import create_v3_application_window; app=QApplication([]); window=create_v3_application_window(); assert len(window.mode_selection.mode_cards) == 3; window.close(); app.quit()"
          $exe = "dist\Vibix Images\Vibix Images.exe"
          if (-not (Test-Path -LiteralPath $exe)) {
            throw "Fresh PyInstaller executable was not found: $exe"
          }
          $packagedArguments = @(
            "--release-entrypoint-smoke",
            "--expected-app-version=${{ steps.version.outputs.app_version }}",
            "--expected-profile=$env:BUILD_PROFILE"
          )
          $packagedCheck = Start-Process -FilePath $exe -ArgumentList $packagedArguments -Wait -PassThru
          if ($packagedCheck.ExitCode -ne 0) {
            throw "Packaged license startup or packaged mode artwork smoke failed with exit code $($packagedCheck.ExitCode)"
          }
          Write-Host "Fresh executable passed source, packaged license startup, and packaged mode artwork smoke checks."

      - name: Download verified Visual C++ runtime
        shell: powershell
        run: |
          $prerequisiteDir = ".\build-prerequisites"
          New-Item -ItemType Directory -Force -Path $prerequisiteDir | Out-Null
          $vcRedistPath = Join-Path $prerequisiteDir "vc_redist.x64.exe"
          Invoke-WebRequest -Uri "https://aka.ms/vc14/vc_redist.x64.exe" -OutFile $vcRedistPath
          $signature = Get-AuthenticodeSignature -FilePath $vcRedistPath
          if ($signature.Status -ne "Valid") {
            throw "Microsoft Visual C++ runtime signature is not valid: $($signature.Status)"
          }
          if ($signature.SignerCertificate.Subject -notlike "*Microsoft Corporation*") {
            throw "Microsoft Visual C++ runtime has an unexpected signer"
          }

      - name: Build Windows setup (Inno Setup)
        shell: powershell
        run: |
          $defines = @("/DAppVersion=${{ steps.version.outputs.app_version }}")
          if ("${{ inputs.acceptance_build }}" -eq "true") { $defines += "/DAcceptanceBuild=1" }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" @defines ".\installer.iss"
          if ($LASTEXITCODE -ne 0) { throw "Installer compilation failed" }

      - name: Fetch original 3.1.4 upgrade fixture
        timeout-minutes: 8
        if: ${{ !inputs.acceptance_build && inputs.legacy_installer_url != '' }}
        shell: powershell
        env:
          LEGACY_INSTALLER_URL: ${{ inputs.legacy_installer_url }}
        run: |
          $uri = [Uri]$env:LEGACY_INSTALLER_URL
          if ($uri.Scheme -ne 'https' -or $uri.Host -notin @('drive.google.com','drive.usercontent.google.com')) { throw "Unexpected legacy installer origin" }
          $path = Join-Path $env:RUNNER_TEMP "VibixImages-Setup-3.1.4.exe"
          $ProgressPreference = 'SilentlyContinue'
          curl.exe --fail --location --proto '=https' --proto-redir '=https' --max-time 180 --retry 1 --output $path $uri.AbsoluteUri
          if ($LASTEXITCODE -ne 0) { throw "Legacy installer download failed" }
          if ((Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash -ne '4AEFD1D4833CBCF59A730CC646598DE4EFC52BE0AACF881CA58C25953DA0E30B') { throw "Legacy installer hash mismatch" }
          "PREVIOUS_INSTALLER_PATH=$path" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify installed Windows application
        shell: powershell
        run: |
          $evidenceDir = Join-Path $env:GITHUB_WORKSPACE "release\ui-evidence"
          $verifyArguments = @{
            InstallerPath = ".\release\$env:INSTALLER_BASENAME.exe"
            ExpectedAppVersion = "${{ steps.version.outputs.app_version }}"
            EvidenceDir = $evidenceDir
            ExpectedProfile = $env:BUILD_PROFILE
          }
          if (-not [string]::IsNullOrWhiteSpace($env:PREVIOUS_INSTALLER_PATH)) {
            $verifyArguments.PreviousInstallerPath = $env:PREVIOUS_INSTALLER_PATH
          }
          & .\scripts\verify_installed_windows_artifact.ps1 @verifyArguments

      - name: Save failed Core smoke evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: core-smoke-failure-${{ github.run_id }}
          retention-days: 3
          if-no-files-found: ignore
          path: |
            release/ui-evidence/*.json
            release/ui-evidence/*.png

      - name: Calculate setup hash
        shell: powershell
        run: |
          $setupPath = "release\$env:INSTALLER_BASENAME.exe"
          $hash = (Get-FileHash $setupPath -Algorithm SHA256).Hash
          "$hash  $(Split-Path -Leaf $setupPath)" | Out-File -FilePath "release\$env:INSTALLER_BASENAME.sha256" -Encoding ascii
          "INSTALLER_SHA256=$hash" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Write build provenance
        shell: powershell
        run: python -m build_provenance

      - name: Validate release contract
        shell: powershell
        run: |
          $profileArgs = @()
          if ("${{ inputs.acceptance_build }}" -eq "true") { $profileArgs += "--acceptance" }
          python release_contract.py `
            --version-file release/VERSION.txt `
            --installer-name "$env:INSTALLER_BASENAME.exe" `
            --executable "dist\Vibix Images\Vibix Images.exe" `
            --checksum "release\$env:INSTALLER_BASENAME.sha256" @profileArgs

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.acceptance_build && 'test-windows' || 'windows' }}-${{ steps.version.outputs.app_version }}
          retention-days: 3
          if-no-files-found: error
          path: |
            release/${{ env.INSTALLER_BASENAME }}.exe
            release/${{ env.INSTALLER_BASENAME }}.sha256
            release/VERSION.txt
            release/build-provenance.json
            release/ui-evidence/*.png
            release/ui-evidence/*.json

  build-macos:
    if: ${{ inputs.build_macos && !inputs.acceptance_build }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            runner: macos-15
            target_arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version and native architecture
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.app_version }}
          TARGET_ARCH: ${{ matrix.target_arch }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = "$TARGET_ARCH"
          version="$(tr -d '\r\n' < release/VERSION.txt)"
          test -z "$INPUT_VERSION" || test "$INPUT_VERSION" = "$version"
          [[ "$version" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"
          echo "app_version=$version" >> "$GITHUB_OUTPUT"
          echo "ARCHIVE_BASENAME=VibixImages-macOS-$version-${{ matrix.platform }}" >> "$GITHUB_ENV"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install constrained dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -c constraints-build.txt -c constraints-macos-build.txt -r requirements.txt
          python -m pip install -c constraints-build.txt -c constraints-macos-build.txt -r requirements-dev.txt

      - name: Verify license, updater, Core packaging and Composer on native macOS
        shell: bash
        run: |
          set -euo pipefail
          python scripts/check_sensitive_artifacts.py --git-tracked --allow-path scripts/check_sensitive_artifacts.py --allow-path tests/test_security_redaction.py
          python -m pytest -q tests/test_license_client_security.py tests/test_v3_license_gate.py tests/test_v3_license_flow_gate.py tests/test_v3_run_queue.py tests/test_release_entrypoint.py tests/test_license_service_contract.py tests/test_update_client.py tests/test_v3_updater.py tests/test_studio_shell_packaging.py tests/test_macos_release_packaging.py tests/test_prompt_composer_runtime.py tests/test_prompt_composer_directions_ui.py tests/test_prompt_composer_nested_scenarios.py tests/test_gpt25_recovery.py tests/test_gpt25_provider.py tests/test_provider_balance.py tests/test_gpt25_async_worker.py tests/test_gpt25_integration.py tests/test_api_settings_review_regressions.py

      - name: Download verified macOS Real-ESRGAN runtime
        shell: bash
        run: |
          set -euo pipefail
          archive_url='https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.5.0/realesrgan-ncnn-vulkan-20220424-macos.zip'
          archive_path="$RUNNER_TEMP/realesrgan-macos.zip"
          expected_sha256='e0ad05580abfeb25f8d8fb55aaf7bedf552c375b5b4d9bd3c8d59764d2cc333a'
          curl --fail --location --retry 3 --output "$archive_path" "$archive_url"
          test "$(shasum -a 256 "$archive_path" | awk '{print $1}')" = "$expected_sha256"
          mkdir -p realesrgan-ncnn-vulkan-20220424-macos
          ditto -x -k "$archive_path" realesrgan-ncnn-vulkan-20220424-macos
          chmod 755 realesrgan-ncnn-vulkan-20220424-macos/realesrgan-ncnn-vulkan
          lipo realesrgan-ncnn-vulkan-20220424-macos/realesrgan-ncnn-vulkan -verify_arch ${{ matrix.target_arch }}
          echo "REAL_ESRGAN_ARCHIVE_URL=$archive_url" >> "$GITHUB_ENV"
          echo "REAL_ESRGAN_ARCHIVE_SHA256=$expected_sha256" >> "$GITHUB_ENV"

      - name: Build current macOS Core shell
        shell: bash
        run: python scripts/build_macos.py --target-arch ${{ matrix.target_arch }} --version "$APP_VERSION"

      - name: Verify frozen application and extracted release
        shell: bash
        run: |
          set -euo pipefail
          app='dist/Vibix Images.app'
          executable="$app/Contents/MacOS/Vibix Images"
          lipo "$executable" -verify_arch ${{ matrix.target_arch }}
          "$executable" --release-entrypoint-smoke "--expected-app-version=$APP_VERSION" --expected-profile=production --ui-evidence-dir=release/ui-evidence
          ditto -c -k --sequesterRsrc --keepParent "$app" "release/$ARCHIVE_BASENAME.zip"
          unzip -t "release/$ARCHIVE_BASENAME.zip"
          extracted="$RUNNER_TEMP/verified-studio"
          mkdir -p "$extracted"
          ditto -x -k "release/$ARCHIVE_BASENAME.zip" "$extracted"
          "$extracted/Vibix Images.app/Contents/MacOS/Vibix Images" --release-entrypoint-smoke "--expected-app-version=$APP_VERSION" --expected-profile=production --ui-evidence-dir=release/extracted-evidence
          hash="$(shasum -a 256 "release/$ARCHIVE_BASENAME.zip" | awk '{print $1}')"
          printf '%s  %s.zip\n' "$hash" "$ARCHIVE_BASENAME" > "release/$ARCHIVE_BASENAME.sha256"
          echo "INSTALLER_SHA256=$hash" >> "$GITHUB_ENV"

      - name: Write build provenance
        run: python -m build_provenance

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-${{ steps.version.outputs.app_version }}
          retention-days: 3
          if-no-files-found: error
          path: |
            release/VibixImages-macOS-*.zip
            release/VibixImages-macOS-*.sha256
            release/VERSION.txt
            release/build-provenance.json
            release/ui-evidence/*.png
            release/ui-evidence/*.json
            release/extracted-evidence/*.json

      - name: Save failed macOS evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: macos-smoke-failure-${{ matrix.platform }}-${{ github.run_id }}
          retention-days: 3
          if-no-files-found: ignore
          path: |
            release/ui-evidence/*.json
            release/ui-evidence/*.png
