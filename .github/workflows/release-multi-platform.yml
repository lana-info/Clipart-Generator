name: Release Multi Platform

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      app_version:
        description: "Версия релиза (пример: 0.1.1)"
        required: true
        default: "2.0"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve app version
        id: version
        shell: powershell
        run: |
          $inputVersion = "${{ github.event.inputs.app_version }}"
          if ([string]::IsNullOrWhiteSpace($inputVersion)) {
            $version = (Get-Content -Raw "release/VERSION.txt").Trim()
          }
          else {
            $version = $inputVersion
          }

          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "app_version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup -y

      - name: Install dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Syntax check
        shell: powershell
        run: python -m py_compile main.py

      - name: Download bundled Local Real-ESRGAN
        shell: powershell
        run: |
          $archiveUrl = "https://github.com/xinntao/Real-ESRGAN-ncnn-vulkan/releases/download/v0.2.0/realesrgan-ncnn-vulkan-v0.2.0-windows.zip"
          $archivePath = Join-Path $env:RUNNER_TEMP "realesrgan-ncnn-vulkan-v0.2.0-windows.zip"
          $extractPath = Join-Path $env:RUNNER_TEMP "realesrgan"
          $targetPath = ".\realesrgan-ncnn-vulkan-20211212-windows"
          Invoke-WebRequest -Uri $archiveUrl -OutFile $archivePath
          Expand-Archive -LiteralPath $archivePath -DestinationPath $extractPath -Force
          $exe = Get-ChildItem -LiteralPath $extractPath -Recurse -Filter "realesrgan-ncnn-vulkan.exe" | Select-Object -First 1
          if (-not $exe) {
            throw "Bundled Local Real-ESRGAN executable was not found after extraction."
          }
          Copy-Item -LiteralPath $exe.Directory.FullName -Destination $targetPath -Recurse -Force

      - name: Build app (PyInstaller)
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File .\build.ps1 -AppVersion ${{ steps.version.outputs.app_version }}

      - name: Build Windows setup (Inno Setup)
        shell: powershell
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.version.outputs.app_version }}" ".\installer.iss"

      - name: Calculate setup hash
        shell: powershell
        run: |
          $setupPath = "release\ClipartGenerator-Setup-${{ steps.version.outputs.app_version }}.exe"
          $hash = (Get-FileHash $setupPath -Algorithm SHA256).Hash
          "WINDOWS_SETUP_SHA256=$hash" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload Windows setup to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.app_version }}
          name: Clipart Generator v${{ steps.version.outputs.app_version }}
          overwrite_files: true
          files: |
            release/ClipartGenerator-Setup-${{ steps.version.outputs.app_version }}.exe
            release/VERSION.txt
