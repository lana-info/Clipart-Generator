name: Desktop CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  fast-and-offscreen:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libopengl0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Syntax and artifact guard
        run: |
          python -m py_compile main.py v3_run_queue.py v3_processing_flow.py
          python scripts/check_sensitive_artifacts.py --git-tracked \
            --allow-path licenses.db \
            --allow-path scripts/check_sensitive_artifacts.py \
            --allow-path tests/test_security_redaction.py

      - name: Test discovery
        run: python -m pytest --collect-only -q

      - name: Fast and offscreen tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Offscreen startup smoke
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -c "from PyQt6.QtWidgets import QApplication; from main import create_v3_application_window; app=QApplication([]); window=create_v3_application_window(); assert len(window.mode_selection.mode_cards) == 3; window.close()"

      - name: Diff check
        run: git diff --check HEAD^ HEAD
